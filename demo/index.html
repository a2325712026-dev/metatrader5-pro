<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),pt=1e-5,pip=1e-4,spread=8*pt,AX=72,R=v=>Math.round(v/pt)*pt,F=v=>v==null?'—':v.toFixed(5);
let bid=1.12250,cs=[],tab=1,open=false,sheet=false,expanded=false,ptab='PREP',prepSide='BUY',lots='0.01',L={entry:null,slim:null,tp:null,sl:null},tpOn=false,slOn=false,exp='直到取消',drag=null,grab=0,pick=null,positions=[],orders=[],balance=5000,nextId=58956001;
const TABS=[['PREP','市价预备单'],['MARKET','市场执行'],['BUY_LIMIT','买入限价'],['SELL_LIMIT','卖出限价'],['BUY_STOP','买入止损'],['SELL_STOP','卖出止损'],['BUY_STOP_LIMIT','买入止损限价'],['SELL_STOP_LIMIT','卖出止损限价']];
(function(){let c=bid;for(let i=0;i<150;i++){const o=c-(Math.random()-.5)*.0012;cs.unshift({o,c,h:Math.max(o,c)+Math.random()*.0004,l:Math.min(o,c)-Math.random()*.0004});c=o}})();
const ask=()=>bid+spread,pend=()=>!['PREP','MARKET'].includes(ptab),side=()=>pend()?(ptab.startsWith('BUY')?'BUY':'SELL'):prepSide,sl_=()=>ptab.endsWith('STOP_LIMIT'),exitRef=()=>side()==='BUY'?bid:ask(),entryRef=()=>side()==='BUY'?ask():bid;
const base=()=>pend()?(sl_()?L.slim:L.entry):exitRef(),linesOn=()=>open&&sheet&&ptab!=='MARKET',lbl=k=>TABS.find(t=>t[0]===k)[1];
function usd(v){return v==null?'— USD':v.toFixed(2)+' USD'}
function pnlAt(px){const e=pend()?(sl_()?L.slim:L.entry):entryRef();return Math.round((side()==='BUY'?px-e:e-px)*(+lots)*1e5*100)/100}
function pnl(p){const cur=p.side==='BUY'?bid:ask();return Math.round((p.side==='BUY'?cur-p.open:p.open-cur)*p.vol*1e5*100)/100}
function match(){positions=positions.filter(p=>{const cur=p.side==='BUY'?bid:ask(),tp=p.tp!=null&&(p.side==='BUY'?cur>=p.tp:cur<=p.tp),sl=p.sl!=null&&(p.side==='BUY'?cur<=p.sl:cur>=p.sl);if(tp||sl){balance+=pnl(p);toast((tp?'✅ 止盈':'⛔ 止损')+' #'+p.id+' 已平仓');return false}return true})}
// ---- MT5 式视口：scroll=从最新往回滚的根数（0=跟随），bw=K线宽，manual=手动价格刻度 ----
const PAD=3;let vp={bw:14,scroll:0,manual:false,hi:0,lo:0},cross=null,flingId=0,lastTap=0;
const PW=()=>cv.width-AX,X=i=>PW()-(cs.length-1-i+PAD-vp.scroll)*vp.bw-vp.bw/2,IDX=x=>(cs.length-1+PAD-vp.scroll)-(PW()-x-vp.bw/2)/vp.bw;
function vis(){return[Math.max(0,Math.floor(IDX(0))),Math.min(cs.length-1,Math.ceil(IDX(PW())))]}
function clampS(){vp.scroll=Math.min(Math.max(vp.scroll,-(PW()/vp.bw)*.5),cs.length-1+PAD-2)}
function panX(dx){vp.scroll+=dx/vp.bw;clampS();if(vis()[0]<30)loadOlder()}
function panY(dy){if(!vp.manual)return;const d=dy/cv.height*(hi-lo);vp.hi=hi+d;vp.lo=lo+d}
function zoomAt(f,fx){const idx=IDX(fx);vp.bw=Math.min(80,Math.max(3,vp.bw*f));vp.scroll=(fx-PW()+vp.bw/2)/vp.bw+(cs.length-1-idx+PAD);clampS()}
function scaleY(f){const m=(hi+lo)/2,h=(hi-lo)/2*f;vp.manual=true;vp.hi=m+h;vp.lo=m-h}
function loadOlder(){let c=cs[0].o;const add=[];for(let i=0;i<200;i++){const o=c-(Math.random()-.5)*.0012;add.unshift({o,c,h:Math.max(o,c)+Math.random()*.0004,l:Math.min(o,c)-Math.random()*.0004});c=o}cs=add.concat(cs);$('hist').textContent='已加载 '+cs.length+' 根'}
let hi,lo;function range(){if(vp.manual){hi=vp.hi;lo=vp.lo;return}const [a,b]=vis(),v=cs.slice(a,b+1).flatMap(k=>[k.h,k.l]);if(vp.scroll<=.5)v.push(...Object.values(L).filter(x=>x!=null&&linesOn()));if(!v.length)v.push(bid);hi=Math.max(...v);lo=Math.min(...v);const p=Math.max((hi-lo)*.08,5*pip);hi+=p;lo-=p}
const Y=v=>(hi-v)/(hi-lo)*cv.height,P=y=>hi-y/cv.height*(hi-lo);
function size(){const r=$('cwrap').getBoundingClientRect();cv.width=r.width;cv.height=r.height}
function tag(y,t,bg){g.fillStyle=bg;g.fillRect(cv.width-AX+2,y-10,AX-4,20);g.fillStyle='#000';g.font='bold 11px sans-serif';g.fillText(t,cv.width-AX+6,y+4)}
const tgl=()=>`<div class="row" style="gap:10px;margin:8px 0"><div data-a="ttp" style="cursor:pointer;padding:8px 16px;border-radius:18px;font-weight:bold;${tpOn?'background:#4caf50;color:#fff':'background:#2a2f36;color:#8a9099;border:1px solid #3a3f47'}">${tpOn?'●':'○'} TP 止盈</div><div data-a="tsl" style="cursor:pointer;padding:8px 16px;border-radius:18px;font-weight:bold;${slOn?'background:#f44336;color:#fff':'background:#2a2f36;color:#8a9099;border:1px solid #3a3f47'}">${slOn?'●':'○'} SL 止损</div>${ptab==='PREP'&&!tpOn?'<span style="color:#ffd54f;font-size:12px">需点亮 TP</span>':''}</div>`;

// ---- v9：委托订单（挂单）线可直接拖动改价：松手 → 校验 → 确认条（旧价 → 新价）→ 确认修改 / 取消 ----
let od=null,prop=null;
const okey=o=>o.k||(TABS.find(t=>t[1]===o.type)||[])[0],oside=o=>okey(o).startsWith('BUY')?'BUY':'SELL',osl=o=>okey(o).endsWith('STOP_LIMIT');
const ofield=k=>k==='entry'?'price':k,ocur=(o,k)=>o[ofield(k)];
const oval=(o,k)=>od&&od.o===o&&od.k===k?od.v:prop&&prop.o===o&&prop.k===k?prop.v:ocur(o,k);
const ONAME={entry:'价格',slim:'限价',tp:'止盈 TP',sl:'止损 SL'},OCOL={entry:'#ffb300',slim:'#ba68c8',tp:'#4caf50',sl:'#f44336'};
function olines(){const r=[];orders.forEach(o=>{['entry','slim','tp','sl'].forEach(k=>{if(k==='slim'&&!osl(o))return;const v=oval(o,k);if(v!=null)r.push({o,k,v,act:(od&&od.o===o&&od.k===k)||(prop&&prop.o===o&&prop.k===k)})})});return r}
function opnl(o,v){const e=osl(o)?oval(o,'slim'):oval(o,'entry');return Math.round((oside(o)==='BUY'?v-e:e-v)*o.vol*1e5*100)/100}
function ovalid(o,k,v){const E=k==='entry'?v:o.price,S=k==='slim'?v:o.slim,T=k==='tp'?v:o.tp,SL=k==='sl'?v:o.sl,key=okey(o),a=ask(),b=bid,buy=oside(o)==='BUY';let e=null;
 if(k==='entry'){if(key==='BUY_LIMIT'&&E>=a)e='Buy Limit 价格必须低于 Ask '+F(a);else if(key==='SELL_LIMIT'&&E<=b)e='Sell Limit 价格必须高于 Bid '+F(b);else if(key.startsWith('BUY_STOP')&&E<=a)e='Buy Stop 触发价必须高于 Ask '+F(a);else if(key.startsWith('SELL_STOP')&&E>=b)e='Sell Stop 触发价必须低于 Bid '+F(b)}
 if(!e&&(k==='entry'||k==='slim')&&osl(o)){if(key==='BUY_STOP_LIMIT'&&S>=E)e='Buy Stop Limit 的限价必须低于触发价';if(key==='SELL_STOP_LIMIT'&&S<=E)e='Sell Stop Limit 的限价必须高于触发价'}
 if(!e){const r=osl(o)?S:E;if(buy){if(T!=null&&T<=r)e='TP 必须高于开仓价';else if(SL!=null&&SL>=r)e='SL 必须低于开仓价'}else{if(T!=null&&T>=r)e='TP 必须低于开仓价';else if(SL!=null&&SL<=r)e='SL 必须高于开仓价'}
  if(e&&(k==='entry'||k==='slim'))e='无法移动：'+e+'（TP/SL 价格保持不变）'}
 return e}
function propose(o,k,v){v=R(v);const old=ocur(o,k);prop=null;if(Math.abs(v-old)<pt/2){render();return}const e=ovalid(o,k,v);if(e){toast('❌ '+e);render();return}prop={o,k,old,v};render()}
function obar(){const b=$('obar');if(!prop||!orders.includes(prop.o)){prop=null;b.style.display='none';return}const o=prop.o,p=prop,tp=o.tp!=null?`TP ${F(o.tp)} → ${usd(opnl(o,o.tp))}`:'',sl=o.sl!=null?`SL ${F(o.sl)} → ${usd(opnl(o,o.sl))}`:'';
 b.style.display='block';b.innerHTML=`<div class="muted" style="font-size:11px">修改挂单</div><div style="font-weight:bold">#${o.id} ${o.type}  ${ONAME[p.k]}  ${F(p.old)} → ${F(p.v)}</div>${tp||sl?`<div class="muted" style="font-size:11px">${tp}${tp&&sl?'    ':''}${sl}</div>`:''}<div class="row" style="gap:10px;margin-top:6px"><button class="ob" id="omno" style="flex:1;height:40px;color:#8a9099">取消</button><button class="btn" id="omyes" style="height:40px;background:#4c8df6">确认修改</button></div>`;
 $('omno').onclick=()=>{prop=null;render()};$('omyes').onclick=()=>{o[ofield(p.k)]=p.v;toast(`✅ 已修改挂单 #${o.id} ${ONAME[p.k]} ${F(p.old)} → ${F(p.v)}`);prop=null;render()}}
function drawOrders(W){g.font='bold 11px sans-serif';olines().forEach(({o,k,v,act})=>{const y=Y(v);if(!act&&(y<-4||y>cv.height+4))return;const inv=od&&od.o===o&&od.k===k&&ovalid(o,k,v),col=inv?'#ff5252':OCOL[k];
  g.strokeStyle=col;g.lineWidth=act?4:1.5;g.setLineDash(act?[]:[6,6]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);g.lineWidth=1;
  const t=`#${String(o.id).slice(-4)} `+(k==='entry'?`${o.type}${osl(o)?' 触发':''} ${o.vol}`:k==='slim'?'限价':k)+(act?'  '+F(v):'')+(k==='tp'||k==='sl'?'  '+usd(opnl(o,v)):'')+(inv?'  ✕ 价格无效':'');
  const tw=g.measureText(t).width;g.fillStyle=col;g.fillRect(4,y-17,tw+12,16);g.fillStyle='#fff';g.fillText(t,10,y-5);if(act)tag(Math.min(Math.max(y,10),cv.height-10),F(v),col)})}
const LINES=()=>[['entry','#ffb300',pend()?lbl(ptab)+(sl_()?' 触发':''):'',linesOn()&&pend()],['slim','#ba68c8','限价',linesOn()&&pend()&&sl_()],['tp','#4caf50','TP',linesOn()&&tpOn],['sl','#f44336','SL',linesOn()&&slOn]];
function draw(){const W=cv.width-AX;g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.font='10px sans-serif';
 for(let i=0;i<=6;i++){const p=hi-(hi-lo)*i/6,y=Y(p);g.strokeStyle='#1e2329';g.setLineDash([3,3]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);g.fillStyle='#9aa0a6';g.fillText(p.toFixed(5),W+6,y+3)}
 const w=vp.bw,[va,vb]=vis();g.save();g.beginPath();g.rect(0,0,W,cv.height);g.clip();for(let i=va;i<=vb;i++){const k=cs[i],x=X(i);g.strokeStyle=g.fillStyle=k.c>=k.o?'#26a69a':'#ef5350';g.beginPath();g.moveTo(x,Y(k.h));g.lineTo(x,Y(k.l));g.stroke();const t=Y(Math.max(k.o,k.c));g.fillRect(x-w*.35,t,w*.7,Math.max(Y(Math.min(k.o,k.c))-t,1))}g.restore();
 positions.forEach(p=>{const y=Y(p.open),col=p.side==='BUY'?'#2e7df6':'#e5484d';g.setLineDash([6,6]);g.strokeStyle=col;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);
  const t=`#${String(p.id).slice(-8)} ${p.side.toLowerCase()} ${p.vol.toFixed(2)}  ${usd(pnl(p))}`;g.font='bold 11px sans-serif';const tw=g.measureText(t).width;g.fillStyle=col;g.fillRect(4,y-17,tw+12,16);g.fillStyle='#fff';g.fillText(t,10,y-5);
  g.fillStyle='#2a2f37';g.fillRect(tw+16,y-17,16,16);g.strokeStyle=col;g.lineWidth=1.5;g.strokeRect(tw+16,y-17,16,16);g.lineWidth=1;g.fillStyle='#fff';g.fillText('✕',tw+19,y-5);p._hit={y,lab:[4,y-17,tw+12,16],btn:[tw+16,y-17,16,16]};
  if(!open){[[p.tp,'#4caf50','tp'],[p.sl,'#f44336','sl']].forEach(([v,c,n])=>{if(v==null)return;g.setLineDash([6,6]);g.strokeStyle=c;g.beginPath();g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();g.setLineDash([]);g.fillStyle=c;g.fillRect(4,Y(v)-17,60,16);g.fillStyle='#fff';g.fillText(n+' #'+String(p.id).slice(-4),8,Y(v)-5)})}});
 drawOrders(W);
 g.strokeStyle='#26a69a';g.beginPath();g.moveTo(0,Y(bid));g.lineTo(W,Y(bid));g.stroke();tag(Y(bid),bid.toFixed(5),'#26a69a');
 for(const [k,col,name,vis] of LINES()){const v=L[k];if(!vis||v==null)continue;const ref=k==='entry'?entryRef():k==='slim'?L.entry:base();
  g.strokeStyle=col;g.lineWidth=drag===k?4:2;g.beginPath();g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();g.lineWidth=1;g.fillStyle=col;g.font='bold 11px sans-serif';
  g.fillText(`${name} ${F(v)}  ${k==='tp'||k==='sl'?usd(pnlAt(v)):Math.round(Math.abs(v-ref)/pip*10)+' pts'}`,6,Y(v)-6);tag(Math.min(Math.max(Y(v),10),cv.height-10),F(v),col)}
 if(cross){g.setLineDash([4,4]);g.strokeStyle='#fffa';g.beginPath();g.moveTo(0,cross.y);g.lineTo(W,cross.y);g.moveTo(cross.x,0);g.lineTo(cross.x,cv.height);g.stroke();g.setLineDash([]);tag(cross.y,F(P(cross.y)),'#fff');
